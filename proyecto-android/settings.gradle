pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Solo para la librería de ADB (Modo avanzado): el filtro impide que JitPack sirva ninguna otra dependencia.
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'com.github.MuntashirAkon'
            }
        }
    }
}

rootProject.name = "app"
include ':app'
